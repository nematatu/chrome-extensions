<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KLTRA 弾幕設定</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>KLTRA 弾幕</h1>
    <p id="status" class="status" role="status">対象ページを確認中…</p>

    <label class="switch-row" for="enabled">
      <span>弾幕を表示</span>
      <input id="enabled" type="checkbox">
    </label>

    <label class="switch-row" for="translationEnabled">
      <span>日本語に翻訳</span>
      <input id="translationEnabled" type="checkbox">
    </label>
    <div class="setting">
      <label for="translationEngine">翻訳方式</label>
      <select id="translationEngine">
        <option value="online">オンライン翻訳（無料）</option>
        <option value="local">端末内（Chrome 内蔵）</option>
      </select>
      <p class="hint">オンラインでは投稿本文を Google 翻訳に送信します。ステッカー・ユーザー名は送信しません。非公式の接続先のため、利用できなくなる場合があります。</p>
    </div>
    <div class="setting">
      <label for="translationSource">チャットの言語</label>
      <select id="translationSource">
        <option value="auto">自動判定</option>
        <option value="id">インドネシア語</option>
        <option value="en">英語</option>
      </select>
    </div>
    <button id="prepareTranslation" type="button" disabled>翻訳を準備</button>
    <p id="translationStatus" class="hint" role="status">翻訳の状態を確認中…</p>
    <button id="fullscreen" type="button" disabled>弾幕付き全画面</button>

    <div class="setting">
      <label for="fontSize">文字サイズ <output id="fontSizeValue" for="fontSize"></output></label>
      <input id="fontSize" type="range" min="14" max="40" step="1">
    </div>
    <div class="setting">
      <label for="transparency">透明度 <output id="transparencyValue" for="transparency"></output></label>
      <input id="transparency" type="range" min="0" max="100" step="5">
      <div class="ends"><span>不透明</span><span>透明</span></div>
    </div>
    <div class="setting">
      <label for="position">表示位置 <output id="positionValue" for="position"></output></label>
      <input id="position" type="range" min="0" max="100" step="5">
      <div class="ends"><span>上</span><span>下</span></div>
    </div>
    <div class="setting">
      <label for="speed">流れる速度 <output id="speedValue" for="speed"></output></label>
      <input id="speed" type="range" min="60" max="300" step="10">
      <div class="ends"><span>遅い</span><span>速い</span></div>
    </div>

    <label class="switch-row" for="showName">
      <span>ユーザー名を表示</span>
      <input id="showName" type="checkbox">
    </label>

    <p class="hint">速度と位置は次の投稿から反映されます。</p>
  </main>
</body>
</html>
