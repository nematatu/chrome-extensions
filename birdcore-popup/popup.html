<!doctype html>
<html lang="ja" class="mt-popup">
  <head>
<link rel="stylesheet" href="ui-tokens.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birdscore Popup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="mt-ui">
    <header class="topbar">
      <div class="topbar-left">
        <img class="topbar-icon" src="icons/icon32.png" alt="" />
        <span>Birdscore</span>
      </div>
      <div id="topbar-right" class="topbar-right">--</div>
    </header>
    <div class="tournament-bar">
      <a
        id="tournament-link"
        class="tournament-link"
        href="https://www.birdscore.live/"
        target="_blank"
        rel="noopener"
        >BIRDSCORE
        <span data-ui-icon="externalLink"></span>
      </a>
      <div id="tournament-name" class="tournament-name">読み込み中…</div>
    </div>

    <main>
      <section class="panel">
        <div class="panel-head">
          <h2>ライブ</h2>
          <span id="live-count" class="badge">0</span>
        </div>
        <div id="live-list" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>終了試合</h2>
          <span id="finished-count" class="badge">0</span>
        </div>
        <div id="finished-list" class="list"></div>
      </section>
    </main>

    <footer class="footer">
      <div id="status" class="status">接続中...</div>
      <div class="footer-actions">
        <button id="open-window" class="ghost">別ウィンドウで開く</button>
        <button id="refresh" class="ghost">更新</button>
      </div>
    </footer>

    <script src="ui-kit.js"></script>
<script src="popup.js"></script>
  </body>
</html>
