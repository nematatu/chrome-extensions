<!doctype html>
<html lang="ja" class="mt-popup"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="ui-tokens.css"><link rel="stylesheet" href="popup.css"><title>better-ig</title></head>
<body class="mt-ui"><h1>better-ig</h1>
<div class="settings">
<label><span>画像・動画を保存</span><input id="download-enabled" type="checkbox"></label>
<label><span>最大解像度で表示</span><input id="quality-enabled" type="checkbox"></label>
<label><span>Liveを横向き表示</span><input id="rotate-live" type="checkbox"></label>
</div>
<p id="quality-status" role="status"></p>
<button id="save">表示済みの投稿を一括保存</button><button id="export-history" disabled>保存履歴を読み込み中…</button>
<p id="status" role="status"></p>
