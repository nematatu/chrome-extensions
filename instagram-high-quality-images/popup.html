<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instagram High Quality Images</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading">
        <span class="mark">HQ</span>
        <div>
          <h1>高画質表示</h1>
          <p>Instagram投稿画像</p>
        </div>
      </div>
      <label class="switch-row">
        <span>最大解像度で表示</span>
        <input id="enabled" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>
      <p id="status" class="status">状態を確認しています…</p>
      <p class="note">ページ内で配信されている画像のうち、最大サイズを使用します。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
