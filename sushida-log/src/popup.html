<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sushida Log</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Sushida Log</h1>
        <span id="count">0件</span>
      </header>

      <section class="toolbar">
        <button id="exportCsv">CSV</button>
        <button id="exportJson">JSON</button>
      </section>

      <section>
        <label>
          <input id="autoResultNetworkRecord" type="checkbox" />
          未解析の結果通信も記録
        </label>
        <label>
          <input id="autoDownloadCsv" type="checkbox" />
          自動でCSV保存
        </label>
      </section>

      <section>
        <h2>手動保存</h2>
        <textarea id="manualText" rows="5" placeholder="X共有テキストを貼り付け"></textarea>
        <button id="saveManual">保存</button>
        <p id="message" role="status"></p>
      </section>

      <section>
        <h2>最新の共有文記録</h2>
        <div id="latest" class="empty">まだ記録がありません。</div>
      </section>

      <section>
        <h2>最新の自動記録</h2>
        <div id="latestNetwork" class="empty">まだ記録がありません。</div>
      </section>

      <section>
        <h2>グラフ</h2>
        <canvas id="chart" width="320" height="160"></canvas>
      </section>

      <section>
        <h2>履歴</h2>
        <ol id="history"></ol>
      </section>
    </main>

    <script src="parser.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
